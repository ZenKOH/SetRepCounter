<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="A simple browser-based set and rep counter with spoken timing cues." />
  <title>Set & Rep Voice Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">SET &amp; REP</p>
        <h1>Voice Counter</h1>
      </div>
      <button id="soundTest" class="ghost-button" type="button" aria-label="Test voice">Test voice</button>
    </header>

    <section class="counter-card" aria-labelledby="phaseLabel">
      <div class="phase-row">
        <span id="phaseLabel" class="phase-label">READY</span>
        <span id="statusBadge" class="status-badge">Idle</span>
      </div>

      <div class="metric-grid">
        <div class="metric">
          <span class="metric-label">SET</span>
          <strong id="setDisplay" class="metric-value">1 / 3</strong>
        </div>
        <div class="metric">
          <span class="metric-label">REP</span>
          <strong id="repDisplay" class="metric-value">0 / 10</strong>
        </div>
      </div>

      <div class="timer-wrap">
        <span class="metric-label">TIME</span>
        <strong id="timeDisplay" class="timer-value">00:05</strong>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <p id="liveStatus" class="sr-only" aria-live="polite">Ready</p>

      <div class="primary-actions">
        <button id="startButton" class="primary-button" type="button">Start</button>
        <button id="pauseButton" class="secondary-button" type="button" disabled>Pause</button>
        <button id="resetButton" class="secondary-button" type="button">Reset</button>
      </div>
    </section>

    <section class="settings-card" aria-labelledby="settingsTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">WORKOUT</p>
          <h2 id="settingsTitle">Settings</h2>
        </div>
        <span class="saved-note">Saved on this device</span>
      </div>

      <div class="setting-list">
        <div class="setting-row">
          <div>
            <label for="sets">Sets</label>
            <span class="setting-help">Total rounds</span>
          </div>
          <div class="stepper">
            <button type="button" data-stepper="sets" data-delta="-1" aria-label="Decrease sets">−</button>
            <input id="sets" type="number" inputmode="numeric" min="1" max="99" value="3" aria-label="Sets" />
            <button type="button" data-stepper="sets" data-delta="1" aria-label="Increase sets">+</button>
          </div>
        </div>

        <div class="setting-row">
          <div>
            <label for="reps">Reps per set</label>
            <span class="setting-help">Repetitions in each set</span>
          </div>
          <div class="stepper">
            <button type="button" data-stepper="reps" data-delta="-1" aria-label="Decrease reps">−</button>
            <input id="reps" type="number" inputmode="numeric" min="1" max="999" value="10" aria-label="Reps per set" />
            <button type="button" data-stepper="reps" data-delta="1" aria-label="Increase reps">+</button>
          </div>
        </div>

        <div class="setting-row">
          <div>
            <label for="repSeconds">Seconds per rep</label>
            <span class="setting-help">Pace for each repetition</span>
          </div>
          <div class="stepper">
            <button type="button" data-stepper="repSeconds" data-delta="-1" aria-label="Decrease seconds per rep">−</button>
            <input id="repSeconds" type="number" inputmode="numeric" min="1" max="60" value="5" aria-label="Seconds per rep" />
            <button type="button" data-stepper="repSeconds" data-delta="1" aria-label="Increase seconds per rep">+</button>
          </div>
        </div>

        <div class="setting-row">
          <div>
            <label for="restSeconds">Rest between sets</label>
            <span class="setting-help">Seconds between rounds</span>
          </div>
          <div class="stepper">
            <button type="button" data-stepper="restSeconds" data-delta="-5" aria-label="Decrease rest time">−</button>
            <input id="restSeconds" type="number" inputmode="numeric" min="0" max="600" step="5" value="30" aria-label="Rest between sets in seconds" />
            <button type="button" data-stepper="restSeconds" data-delta="5" aria-label="Increase rest time">+</button>
          </div>
        </div>
      </div>

      <div class="toggle-grid">
        <label class="toggle-row">
          <span>
            <strong>Voice</strong>
            <small>Speak sets and reps</small>
          </span>
          <input id="voiceEnabled" type="checkbox" checked />
        </label>

        <label class="toggle-row">
          <span>
            <strong>Speak timing</strong>
            <small>Count down rep timing and rest cues</small>
          </span>
          <input id="speakTiming" type="checkbox" checked />
        </label>

        <label class="toggle-row">
          <span>
            <strong>3-second countdown</strong>
            <small>Prepare before the first rep</small>
          </span>
          <input id="startCountdown" type="checkbox" checked />
        </label>

        <label class="toggle-row">
          <span>
            <strong>Beep</strong>
            <small>Sound at phase changes</small>
          </span>
          <input id="beepEnabled" type="checkbox" />
        </label>
      </div>
    </section>

    <footer>
      <p>No sign-in, server or patient data. Settings stay in your browser.</p>
    </footer>
  </main>

  <script src="app.js?v=20261007-iosfix1"></script>
</body>
</html>
